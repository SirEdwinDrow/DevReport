name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: pytest

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -n 1)
          SMOKE_DIR="${RUNNER_TEMP}/devreport-smoke"
          mkdir -p "$SMOKE_DIR"
          python -m venv "$SMOKE_DIR/venv"
          if [ -f "$SMOKE_DIR/venv/Scripts/python" ]; then
            PY="$SMOKE_DIR/venv/Scripts/python"
            PIP="$SMOKE_DIR/venv/Scripts/pip"
          else
            PY="$SMOKE_DIR/venv/bin/python"
            PIP="$SMOKE_DIR/venv/bin/pip"
          fi
          "$PIP" install "$WHEEL"
          cd "$SMOKE_DIR"
          "$PY" -m devreport --help
          "$PY" -m devreport collect --preview
