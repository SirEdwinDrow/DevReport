name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        # Чистый .coverage: pytest-cov 6.x падает DataError при combine
        # statement-only и branch data (чужие/старые .coverage.*).
        run: |
          python -m coverage erase
          pytest

      - name: Build wheel and sdist
        run: |
          pip install "build>=1.2,<2"
          python -m build

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -n 1)
          SMOKE_DIR="${RUNNER_TEMP}/devreport-smoke"
          mkdir -p "$SMOKE_DIR"
          python -m venv "$SMOKE_DIR/venv"
          if [ -f "$SMOKE_DIR/venv/Scripts/python" ]; then
            PY="$SMOKE_DIR/venv/Scripts/python"
            PIP="$SMOKE_DIR/venv/Scripts/pip"
          else
            PY="$SMOKE_DIR/venv/bin/python"
            PIP="$SMOKE_DIR/venv/bin/pip"
          fi
          "$PIP" install "$WHEEL"
          cd "$SMOKE_DIR"
          "$PY" -m devreport --help
          "$PY" -m devreport collect --preview
